<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Weirdle</title>

</head>
<body>
    <h1 style="text-align: center">Weirdle</h1>
    <div id="main-content">
        <div id="article">Loading article...</div>
        <div id="guesses">
            <input type="text" id="guessBox" placeholder="Guess a word">
            <button onclick="guessWord()">Guess Word</button>
            <ul id="guessList"></ul>
        </div>
    </div>
    <div id="reveal">
        <input type="text" id="titleGuess" placeholder="Guess the title">
        <button onclick="guessTitle()">Guess Title</button>
        <br><br>
        <button onclick="revealArticle()">Reveal Article</button>
            <div id="result"></div>
        </div>

    <script src="script.js"></script>
</body>
</html>
